name: ci for build and pushing the docker image
description: This workflow is used to build and push the docker image.
on:
  push:
    branches:
      - main
env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKER_USERNAME }}
  DOCKERHUB_KEY: ${{ secrets.DOCKER_PASSWORD }}
jobs:
  dev-workflow:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Dockerhub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_KEY }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/fastapi:dev

      - name: create SSH key file
        run: |
          echo "${{ secrets.BETA_SERVER_SSH_KEY}}" > /tmp/id_rsa
          chmod 600 /tmp/id_rsa
      - name: Login to SSDNodes server
        run: |
          ssh -o StrictHostKeyChecking=no -i /tmp/id_rsa ${{ secrets.BETA_SERVER_USERNAME }}@${{ secrets.BETA_SERVER_IP}} -p 61001 '
            CONTAINER_ID=$(docker ps -aq --filter name=fastapi)
            IMAGE_NAME=${{ env.DOCKERHUB_USERNAME }}/fastapi:dev
            echo "${{ env.DOCKERHUB_KEY }}" | docker login -u "${{ env.DOCKERHUB_USERNAME }}" --password-stdin
            docker pull $IMAGE_NAME
            if [ -n "$CONTAINER_ID" ]; then
            docker stop $CONTAINER_ID && docker rm $CONTAINER_ID
            fi
            docker run -d -p 8000:8000 --restart=unless-stopped --env-file=.env --name=fastapi $IMAGE_NAME
            sleep 30 && docker logs fastapi
          '
      - name: Remove SSH key and .env
        if: always()
        run: |
          rm -f /tmp/id_rsa
